; PlatformIO Project Configuration File
; Solar-Charged Ultra-Low-Power LED Fidget Keychain (ATtiny1616 @ 1 MHz)

[platformio]
default_envs = serialupdi

[env]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino
; Run ATtiny1616 at 1 MHz internal oscillator (16 MHz / 16 prescaler) for ultra-low active current
board_build.f_cpu = 1000000L
build_flags =
    -Wall
    -Wextra
    -Os

[env:serialupdi]
; Standard USB-to-UART (CH340/CP2102) + 4.7k resistor on TX/RX -> UPDI
upload_protocol = serialupdi
upload_speed = 115200
; Set upload_port = /dev/ttyUSB0  ; or COMx on Windows

[env:pymcuprog]
; Alternative direct pymcuprog upload (see README_FLASHING.md)
upload_protocol = custom
upload_command = pymcuprog write -t uart -u $UPLOAD_PORT -d attiny1616 -f $SOURCE --erase --verify
